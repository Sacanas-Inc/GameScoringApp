name: "Run Tests"
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install
        run: yarn install
      - name: Lint
        run: yarn lint
      - name: Run Tests
        run: yarn test
